name: Publish verified Codia v0.3.3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codia-publish-v0.3.3
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'BaiQiaochu/Codia' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify pinned successful builds and prepare complete distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'CODIA_PY'
          import hashlib, json, os, pathlib, shutil, subprocess, urllib.request, urllib.error, zipfile
          REPO = 'BaiQiaochu/Codia'
          SOURCE = 'c2f80c003c6d32199957eda70b01b7029ac68081'
          MULTI_RUN = 39194362899  # Publication still requires completed/success for this exact run.
          MULTI = 'fd02cc0285ca8bc07b5630c32bd53a54819696d7'
          TAG = 'v0.3.3'
          NODE_HASH = '4573185d56580da2b890ba34a85a409257640f1c5632eade4300137266194d18'
          ROOT = pathlib.Path('release-assets')
          def require(condition, message):
              if not condition: raise RuntimeError(message)
          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for block in iter(lambda: f.read(8 * 1024 * 1024), b''): h.update(block)
              return h.hexdigest()
          def api(path, method='GET', data=None, missing=False):
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=120) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404: return None
                  raise
          def pages(path):
              out = []
              for page in range(1, 101):
                  batch = api(path + ('&' if '?' in path else '?') + f'per_page=100&page={page}')
                  out.extend(batch)
                  if len(batch) < 100: return out
              raise RuntimeError('Pagination limit reached')
          def absent():
              require(api('git/ref/tags/' + TAG, missing=True) is None, 'Tag already exists; never overwrite')
              require(api('releases/tags/' + TAG, missing=True) is None, 'Release already exists; never overwrite')
              require(not any(r['tag_name'] == TAG for r in pages('releases')), 'Draft release already exists; inspect manually')
          def check_run(run_id, head, workflow):
              run = api(f'actions/runs/{run_id}')
              require(str(run['id']) == str(run_id) and run['repository']['full_name'] == REPO, 'Run identity mismatch')
              require(run['head_sha'] == head and run['path'] == workflow, 'Workflow commit/path mismatch')
              require(run['event'] == 'workflow_dispatch' and run['status'] == 'completed' and run['conclusion'] == 'success', 'Build not successful')
              return run
          def record(path): return {'name': path.name, 'bytes': path.stat().st_size, 'sha256': sha(path)}
          def validate_record(path, item):
              require(path.is_file() and item['bytes'] > 0 and record(path) == item, 'Asset hash/size/name mismatch: ' + path.name)
          def run_checks():
              return [check_run(39157457223, SOURCE, '.github/workflows/package-windows.yml'),
                      check_run(MULTI_RUN, MULTI, '.github/workflows/package-multiplatform.yml')]
          def check_asset_sizes():
              for path in ROOT.iterdir():
                  require(path.is_file() and 0 < path.stat().st_size < 2 * 1024**3, 'Release asset must be nonempty and smaller than 2 GiB: ' + path.name)
          def portable_node_notice(names):
              suffix = 'resources/server/codia-server.exe'
              matches = [name for name in names if name.endswith('/' + suffix) or name == suffix]
              require(len(matches) == 1, 'Portable renamed Node runtime path ambiguous')
              return str(pathlib.PurePosixPath(matches[0]).parent / 'Node-LICENSE.txt')
          
          require(os.environ['GITHUB_REPOSITORY'] == REPO, 'Wrong repository')
          absent()
          runs = run_checks()
          ROOT.mkdir()
          work = pathlib.Path('downloads'); work.mkdir()
          metadata = {'version': '0.3.3', 'sourceCommit': SOURCE, 'buildRuns': runs, 'inputs': [], 'assets': [],
           'verificationScope': 'Original Windows installer hash and packaged Live2D provenance; Linux/macOS package integrity, native SQLite/PTY smoke. No end-user installation or GUI/GPU acceptance.',
           'signing': {'windows': 'Unsigned distribution; SmartScreen may warn.', 'macOS': 'No distribution signing or notarization; Gatekeeper acceptance unverified.', 'linux': 'No package signing.'}}
          def get_artifact(artifact, run_id, head, expected_name, dest):
              require(artifact['name'] == expected_name and not artifact['expired'], 'Artifact name/expiry mismatch')
              require(str(artifact['workflow_run']['id']) == str(run_id) and artifact['workflow_run']['head_sha'] == head, 'Artifact run mismatch')
              archive = work / (str(artifact['id']) + '.zip')
              with archive.open('wb') as output:
                  subprocess.run(['gh', 'api', f'repos/{REPO}/actions/artifacts/{artifact["id"]}/zip'], stdout=output, check=True)
              digest = artifact.get('digest')
              if digest: require(digest == 'sha256:' + sha(archive), 'GitHub artifact container digest mismatch')
              dest.mkdir()
              with zipfile.ZipFile(archive) as z:
                  require(len(z.namelist()) == len(set(z.namelist())), 'Duplicate ZIP names')
                  for item in z.infolist():
                      p = pathlib.PurePosixPath(item.filename)
                      require(not p.is_absolute() and '..' not in p.parts and '\\' not in item.filename, 'Unsafe ZIP path')
                      require((item.external_attr >> 16) & 0o170000 != 0o120000, 'Symlink artifact not allowed')
                  z.extractall(dest)
              archive.unlink()
              metadata['inputs'].append(artifact)
              return json.loads((dest / 'build-provenance.json').read_text())
          win = api('actions/artifacts/12147981293')
          wd = work / 'windows'
          p = get_artifact(win, 39157457223, SOURCE, 'Codia-Windows-x64-installer-' + SOURCE, wd)
          require(p['commit'] == SOURCE and p['run'] == '39157457223' and p['version'] == '0.3.3' and p['platform'] == 'win32-x64', 'Windows provenance mismatch')
          expected_exe = {'name': 'Codia-0.3.3-Windows-x64.exe', 'bytes': 550042656, 'sha256': '98adb7e805028a6efe63627f1daabdddcaf2bc9120b114522ce6b4dad4e7cb4b'}
          require(p['artifacts'] == [expected_exe], 'Windows artifact list mismatch')
          validate_record(wd / expected_exe['name'], expected_exe)
          license_path = ROOT / 'Node-v24.15.0-LICENSE.txt'
          with urllib.request.urlopen('https://raw.githubusercontent.com/nodejs/node/v24.15.0/LICENSE', timeout=120) as response:
              license_path.write_bytes(response.read())
          require(sha(license_path) == NODE_HASH, 'Upstream Node license changed')
          notice = f'''Codia 0.3.3 Windows distribution notices\n\nThe installer EXE is byte-for-byte the original GitHub Actions build.\nThe complete Node.js v24.15.0 license is supplied alongside it in this ZIP.\nKeep these notices with redistributed copies.\n\nApache-2.0 covers Codia's own code only. Third-party components retain\ntheir original licenses. This notice does not replace those licenses.\nLive2D original license and notice files:\nhttps://github.com/{REPO}/tree/{SOURCE}/third_party/live2d/cubism-web-5-r.5\nPackaged Live2D notices: resources/app.asar, desktop/dist-renderer/assets/codia/live2d/licenses/\nNode runtime: Node-v24.15.0-LICENSE.txt (complete upstream license)\nOther original Electron, Chromium, Git and dependency notices remain in the package.\nThe Windows package preserves 67 original Git license/notice files.\nBundled Git for Windows 2.54.0.windows.1 official release/source index:\nhttps://github.com/git-for-windows/git/releases/tag/v2.54.0.windows.1\nThe supplementary licenses directory contains project, font, KaTeX and Node notices.\nThe shared Codia-0.3.3-LICENSES.zip accompanies all release platforms.\n\nUnsigned Windows build; installation and GUI/GPU acceptance are unverified.\n'''
          (ROOT / 'THIRD-PARTY-NOTICES.txt').write_text(notice)
          LICENSE_PAYLOAD_SHA256 = '650e2b1dcf7716f7624d9da1464b0a2ea61082bff482fe5bc9c83d68a2f95608'
          LICENSE_PAYLOAD_BASE64 = ''
          import base64, io
          license_dir = work / 'licenses'; license_dir.mkdir()
          payload = base64.b64decode(LICENSE_PAYLOAD_BASE64, validate=True)
          require(hashlib.sha256(payload).hexdigest() == LICENSE_PAYLOAD_SHA256, 'Embedded license archive digest mismatch')
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              require(len(z.namelist()) == len(set(z.namelist())), 'Duplicate embedded license names')
              for name in z.namelist():
                  require(pathlib.PurePosixPath(name).name == name and name not in ('.', '..'), 'Unsafe license name')
                  (license_dir / name).write_bytes(z.read(name))
          for name, source_info in json.loads((license_dir / 'sources.json').read_text()).items():
              require(sha(license_dir / name) == source_info['sha256'], 'Original license text changed: ' + name)
          shutil.copyfile(license_path, license_dir / license_path.name)
          (license_dir / 'THIRD-PARTY-NOTICES.txt').write_text(notice)
          sources = json.loads((license_dir / 'sources.json').read_text())
          sources[license_path.name] = {'url': 'https://raw.githubusercontent.com/nodejs/node/v24.15.0/LICENSE', 'sha256': NODE_HASH, 'bytes': license_path.stat().st_size}
          (license_dir / 'sources.json').write_text(json.dumps(sources, indent=2) + '\n')
          (license_dir / 'SHA256SUMS.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(license_dir.iterdir())))
          license_records = [record(p) for p in sorted(license_dir.iterdir())]
          def append_licenses(z):
              for p in sorted(license_dir.iterdir()):
                  name = 'licenses/' + p.name
                  require(name not in z.namelist(), 'License addition would replace existing entry: ' + name)
                  z.write(p, name)
          def check_licenses(z):
              for item in license_records:
                  content = z.read('licenses/' + item['name'])
                  require(len(content) == item['bytes'] and hashlib.sha256(content).hexdigest() == item['sha256'], 'Bundled license mismatch')
          with zipfile.ZipFile(ROOT / 'Codia-0.3.3-LICENSES.zip', 'w', compression=zipfile.ZIP_DEFLATED) as z:
              append_licenses(z)
          with zipfile.ZipFile(ROOT / 'Codia-0.3.3-LICENSES.zip') as z: check_licenses(z)
          metadata['supplementaryLicenses'] = license_records
          with zipfile.ZipFile(ROOT / 'Codia-0.3.3-Windows-x64-installer.zip', 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as z:
              z.write(wd / expected_exe['name'], expected_exe['name'])
              z.write(license_path, license_path.name)
              z.write(ROOT / 'THIRD-PARTY-NOTICES.txt', 'THIRD-PARTY-NOTICES.txt')
              append_licenses(z)
          with zipfile.ZipFile(ROOT / 'Codia-0.3.3-Windows-x64-installer.zip') as z:
              check_licenses(z)
              h = hashlib.sha256()
              with z.open(expected_exe['name']) as f:
                  for block in iter(lambda: f.read(8 * 1024 * 1024), b''): h.update(block)
              require(h.hexdigest() == expected_exe['sha256'], 'Wrapped EXE changed')
          shutil.copyfile(wd / 'build-provenance.json', ROOT / 'Windows-x64-build-provenance.json')
          metadata['windowsOriginalInstaller'] = expected_exe
          metadata['windowsTransformation'] = 'Original installer wrapped unchanged with complete supplementary licenses, upstream Node license and a notice index; no binary edits.'
          artifacts = []
          for page in range(1, 101):
              response = api(f'actions/runs/{MULTI_RUN}/artifacts?per_page=100&page={page}')
              batch = response['artifacts']; artifacts.extend(batch)
              if len(batch) < 100: break
          else: raise RuntimeError('Artifact pagination exceeded')
          for label, platform, arch, names in [
           ('Linux-x64', 'linux', 'x64', ['Codia-0.3.3-Linux-amd64.deb', 'Codia-0.3.3-Linux-x86_64.AppImage']),
           ('macOS-x64', 'darwin', 'x64', ['Codia-0.3.3-macOS-x64.dmg', 'Codia-0.3.3-macOS-x64.zip']),
           ('macOS-arm64', 'darwin', 'arm64', ['Codia-0.3.3-macOS-arm64.dmg', 'Codia-0.3.3-macOS-arm64.zip'])]:
              name = 'Codia-0.3.3-' + label + '-' + SOURCE
              matches = [a for a in artifacts if a['name'] == name]
              require(len(matches) == 1, 'Missing/ambiguous artifact: ' + name)
              dest = work / label
              p = get_artifact(matches[0], MULTI_RUN, MULTI, name, dest)
              require(p['commit'] == SOURCE and p['workflowCommit'] == MULTI and p['run'] == str(MULTI_RUN), 'Source/workflow provenance mismatch')
              require(p['version'] == '0.3.3' and p['platform'] == platform and p['arch'] == arch, 'Platform/version mismatch')
              require(sorted(a['name'] for a in p['artifacts']) == sorted(names), 'Unexpected package set')
              require(p['nodeLicense']['sha256'] == NODE_HASH, 'Missing/wrong packaged Node license')
              for item in p['artifacts']:
                  validate_record(dest / item['name'], item)
                  shutil.move(dest / item['name'], ROOT / item['name'])
              shutil.copyfile(dest / 'build-provenance.json', ROOT / (label + '-build-provenance.json'))
          portable = api('actions/artifacts/12148036166')
          require(portable['name'] == 'Codia-Windows-x64-portable-' + SOURCE and not portable['expired'], 'Portable artifact identity/expiry mismatch')
          require(str(portable['workflow_run']['id']) == '39157457223' and portable['workflow_run']['head_sha'] == SOURCE, 'Portable artifact run mismatch')
          portable_hash = '29e9de815b34175ad1692459015bdd5333bfb13e35436559b48f72c5784a23c0'
          require(portable['digest'] == 'sha256:' + portable_hash and portable['size_in_bytes'] == 1504166754, 'Portable original metadata mismatch')
          portable_path = ROOT / 'Codia-0.3.3-Windows-x64-portable.zip'
          with portable_path.open('wb') as output:
              subprocess.run(['gh', 'api', f'repos/{REPO}/actions/artifacts/12148036166/zip'], stdout=output, check=True)
          require(sha(portable_path) == portable_hash and portable_path.stat().st_size == 1504166754, 'Portable original ZIP checksum mismatch')
          original_files = []
          with zipfile.ZipFile(portable_path) as z:
              require(len(z.namelist()) == len(set(z.namelist())), 'Duplicate portable ZIP paths')
              for entry in z.infolist():
                  q = pathlib.PurePosixPath(entry.filename)
                  require(not q.is_absolute() and '..' not in q.parts and '\\' not in entry.filename, 'Unsafe portable ZIP path')
                  require((entry.external_attr >> 16) & 0o170000 != 0o120000, 'Portable symlink unexpected')
                  if not entry.is_dir():
                      h = hashlib.sha256()
                      with z.open(entry) as f:
                          for block in iter(lambda: f.read(8 * 1024 * 1024), b''): h.update(block)
                      original_files.append({'name': entry.filename, 'bytes': entry.file_size, 'sha256': h.hexdigest()})
              node_notice = portable_node_notice(z.namelist())
              runtime_path = str(pathlib.PurePosixPath(node_notice).parent / 'codia-server.exe')
              require(z.getinfo(runtime_path).file_size == 91694408, 'Portable renamed Node runtime size mismatch')
              require(node_notice not in z.namelist() and 'CODIA-DISTRIBUTION-NOTICES.txt' not in z.namelist(), 'Notice path already exists; inspect first')
          with zipfile.ZipFile(portable_path, 'a', compression=zipfile.ZIP_DEFLATED, allowZip64=True) as z:
              z.write(license_path, node_notice)
              z.writestr('CODIA-DISTRIBUTION-NOTICES.txt', notice.replace('installer', 'portable'))
              append_licenses(z)
          with zipfile.ZipFile(portable_path) as z:
              check_licenses(z)
              for entry in original_files:
                  h = hashlib.sha256()
                  with z.open(entry['name']) as f:
                      for block in iter(lambda: f.read(8 * 1024 * 1024), b''): h.update(block)
                  require(z.getinfo(entry['name']).file_size == entry['bytes'] and h.hexdigest() == entry['sha256'], 'Portable original file changed')
              require(hashlib.sha256(z.read(node_notice)).hexdigest() == NODE_HASH, 'Portable Node notice checksum mismatch')
          metadata['inputs'].append(portable)
          (ROOT / 'Windows-x64-portable-transformation.json').write_text(json.dumps({
           'sourceRun': '39157457223', 'sourceCommit': SOURCE, 'originalArtifactId': 12148036166,
           'originalArtifactBytes': 1504166754, 'originalArtifactSHA256': portable_hash,
           'transformation': 'Append complete supplementary licenses, Node license and notice index only; every original archive entry retains its uncompressed bytes.',
           'addedFiles': [node_notice, 'CODIA-DISTRIBUTION-NOTICES.txt'] + ['licenses/' + p['name'] for p in license_records], 'originalFiles': original_files,
           'distribution': record(portable_path)}, indent=2) + '\n')
          metadata['assets'] = [record(p) for p in sorted(ROOT.iterdir())]
          (ROOT / 'release-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(ROOT.iterdir())))
          notes = f'''# Codia v0.3.3\n\nSource: [`{SOURCE}`](https://github.com/{REPO}/commit/{SOURCE}).\n\n- Windows x64: download `Codia-0.3.3-Windows-x64-installer.zip`, extract it, and run the EXE. The original EXE is unchanged; the ZIP adds complete supplementary licenses and a notice index.\n- Windows x64 portable: extract the portable ZIP; original files are unchanged, with complete supplementary licenses and notice index added.\n- Linux x64: Debian package and AppImage.\n- macOS: DMG and ZIP for Intel x64 and Apple Silicon arm64.\n\nThese builds are unsigned distributions. macOS is not notarized; Windows SmartScreen and macOS Gatekeeper may warn or block. Linux packages are not signed.\n\nValidation: original Windows installer checksum and packaged Live2D resources; Linux/macOS package/container/resource integrity and native SQLite/PTY smoke checks. End-user installation, GUI/GPU behavior, and operating-system trust acceptance have not been verified.\n\nApache-2.0 applies to Codia's own code only. Third-party components retain their original licenses and notices. See the [original Live2D license and notice files](https://github.com/{REPO}/tree/{SOURCE}/third_party/live2d/cubism-web-5-r.5) and included third-party notices. Download `Codia-0.3.3-LICENSES.zip` alongside any platform package for the complete supplementary project, font, KaTeX and Node notices. Both Windows ZIPs also include the same `licenses/` directory; the six Linux/macOS package files remain unchanged. The Windows distribution preserves 67 original Git license/notice files; see the [matching Git for Windows release/source index](https://github.com/git-for-windows/git/releases/tag/v2.54.0.windows.1).\n\nUse `SHA256SUMS.txt`, `release-metadata.json`, and the platform provenance reports to verify downloads and source/build provenance.\n'''
          pathlib.Path('release-notes.md').write_text(notes)
          manifest = [dict(record(p), relative=str(p)) for p in sorted(ROOT.iterdir())]
          manifest.append(dict(record(pathlib.Path('release-notes.md')), relative='release-notes.md'))
          pathlib.Path('transfer-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          check_asset_sizes()
          print('Verified complete release asset set:', [p.name for p in ROOT.iterdir()])
          CODIA_PY
      - name: Transfer verified assets to isolated publishing job
        uses: actions/upload-artifact@v4
        with:
          name: Codia-v0.3.3-verified-release-${{ github.run_id }}
          path: |
            release-assets/
            release-notes.md
            transfer-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - name: Retrieve this run's verified distributions
        uses: actions/download-artifact@v4
        with:
          name: Codia-v0.3.3-verified-release-${{ github.run_id }}
          path: .
      - name: Create draft, verify every uploaded asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'CODIA_PY'
          import hashlib, json, os, pathlib, shutil, subprocess, urllib.request, urllib.error, zipfile
          REPO = 'BaiQiaochu/Codia'
          SOURCE = 'c2f80c003c6d32199957eda70b01b7029ac68081'
          MULTI_RUN = 39194362899  # Publication still requires completed/success for this exact run.
          MULTI = 'fd02cc0285ca8bc07b5630c32bd53a54819696d7'
          TAG = 'v0.3.3'
          NODE_HASH = '4573185d56580da2b890ba34a85a409257640f1c5632eade4300137266194d18'
          ROOT = pathlib.Path('release-assets')
          def require(condition, message):
              if not condition: raise RuntimeError(message)
          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for block in iter(lambda: f.read(8 * 1024 * 1024), b''): h.update(block)
              return h.hexdigest()
          def api(path, method='GET', data=None, missing=False):
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=120) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404: return None
                  raise
          def pages(path):
              out = []
              for page in range(1, 101):
                  batch = api(path + ('&' if '?' in path else '?') + f'per_page=100&page={page}')
                  out.extend(batch)
                  if len(batch) < 100: return out
              raise RuntimeError('Pagination limit reached')
          def absent():
              require(api('git/ref/tags/' + TAG, missing=True) is None, 'Tag already exists; never overwrite')
              require(api('releases/tags/' + TAG, missing=True) is None, 'Release already exists; never overwrite')
              require(not any(r['tag_name'] == TAG for r in pages('releases')), 'Draft release already exists; inspect manually')
          def check_run(run_id, head, workflow):
              run = api(f'actions/runs/{run_id}')
              require(str(run['id']) == str(run_id) and run['repository']['full_name'] == REPO, 'Run identity mismatch')
              require(run['head_sha'] == head and run['path'] == workflow, 'Workflow commit/path mismatch')
              require(run['event'] == 'workflow_dispatch' and run['status'] == 'completed' and run['conclusion'] == 'success', 'Build not successful')
              return run
          def record(path): return {'name': path.name, 'bytes': path.stat().st_size, 'sha256': sha(path)}
          def validate_record(path, item):
              require(path.is_file() and item['bytes'] > 0 and record(path) == item, 'Asset hash/size/name mismatch: ' + path.name)
          def run_checks():
              return [check_run(39157457223, SOURCE, '.github/workflows/package-windows.yml'),
                      check_run(MULTI_RUN, MULTI, '.github/workflows/package-multiplatform.yml')]
          def check_asset_sizes():
              for path in ROOT.iterdir():
                  require(path.is_file() and 0 < path.stat().st_size < 2 * 1024**3, 'Release asset must be nonempty and smaller than 2 GiB: ' + path.name)
          def portable_node_notice(names):
              suffix = 'resources/server/codia-server.exe'
              matches = [name for name in names if name.endswith('/' + suffix) or name == suffix]
              require(len(matches) == 1, 'Portable renamed Node runtime path ambiguous')
              return str(pathlib.PurePosixPath(matches[0]).parent / 'Node-LICENSE.txt')
          
          require(os.environ['GITHUB_REPOSITORY'] == REPO and os.environ['GITHUB_REF'] == 'refs/heads/main', 'Publication restricted to main in original repository')
          manifest = json.loads(pathlib.Path('transfer-manifest.json').read_text())
          expected = set()
          for item in manifest:
              relative = pathlib.PurePosixPath(item['relative'])
              require(not relative.is_absolute() and '..' not in relative.parts, 'Unsafe transfer path')
              require(item['relative'] == 'release-notes.md' or relative.parent == pathlib.PurePosixPath('release-assets'), 'Unexpected transfer path')
              path = pathlib.Path(item['relative'])
              validate_record(path, {k: item[k] for k in ('name', 'bytes', 'sha256')})
              expected.add(str(path))
          require(expected == {'release-notes.md'} | {str(p) for p in ROOT.iterdir()}, 'Transfer file-set mismatch')
          meta = json.loads((ROOT / 'release-metadata.json').read_text())
          require(meta['sourceCommit'] == SOURCE and meta['version'] == '0.3.3', 'Release metadata mismatch')
          binary_names = {
           'Codia-0.3.3-LICENSES.zip',
           'Codia-0.3.3-Windows-x64-installer.zip', 'Codia-0.3.3-Windows-x64-portable.zip',
           'Codia-0.3.3-Linux-amd64.deb', 'Codia-0.3.3-Linux-x86_64.AppImage',
           'Codia-0.3.3-macOS-x64.dmg', 'Codia-0.3.3-macOS-x64.zip',
           'Codia-0.3.3-macOS-arm64.dmg', 'Codia-0.3.3-macOS-arm64.zip'}
          require(binary_names.issubset({p.name for p in ROOT.iterdir()}), 'Incomplete platform set')
          for item in meta['assets']: validate_record(ROOT / item['name'], item)
          check_asset_sizes()
          run_checks()
          absent()
          release = api('releases', 'POST', {'tag_name': TAG, 'target_commitish': SOURCE,
              'name': 'Codia v0.3.3', 'body': pathlib.Path('release-notes.md').read_text(),
              'draft': True, 'prerelease': False, 'make_latest': 'false'})
          release_id = release['id']
          print('Created draft release', release['html_url'], flush=True)
          require(release['draft'] and release['tag_name'] == TAG and release['target_commitish'] == SOURCE, 'Draft identity mismatch')
          for path in sorted(ROOT.iterdir()):
              subprocess.run(['gh', 'release', 'upload', TAG, str(path), '--repo', REPO], check=True)
          remote_assets = pages(f'releases/{release_id}/assets')
          local = {p.name: record(p) for p in ROOT.iterdir()}
          require(len(remote_assets) == len(local) and {a['name'] for a in remote_assets} == set(local), 'Remote asset-set mismatch')
          for asset in remote_assets:
              item = local[asset['name']]
              require(asset['state'] == 'uploaded' and asset['size'] == item['bytes'], 'Remote asset state/size mismatch')
              if asset.get('digest'):
                  require(asset['digest'] == 'sha256:' + item['sha256'], 'Remote asset SHA256 mismatch')
              else:
                  temp = pathlib.Path('remote-asset-check.tmp')
                  with temp.open('wb') as output:
                      subprocess.run(['gh', 'api', '-H', 'Accept: application/octet-stream',
                          f'repos/{REPO}/releases/assets/{asset["id"]}'], stdout=output, check=True)
                  require(temp.stat().st_size == item['bytes'] and sha(temp) == item['sha256'], 'Downloaded remote asset mismatch')
                  temp.unlink()
          ref = api('git/ref/tags/' + TAG, missing=True)
          if ref is not None:
              require(ref['object']['type'] == 'commit' and ref['object']['sha'] == SOURCE, 'Draft tag points at wrong source')
          current = api(f'releases/{release_id}')
          require(current['draft'] and current['tag_name'] == TAG and current['target_commitish'] == SOURCE, 'Draft changed during upload')
          published = api(f'releases/{release_id}', 'PATCH', {'draft': False, 'prerelease': False, 'make_latest': 'true'})
          require(not published['draft'] and not published['prerelease'], 'Release publication not confirmed')
          ref = api('git/ref/tags/' + TAG)
          require(ref['object']['type'] == 'commit' and ref['object']['sha'] == SOURCE, 'Published tag mismatch')
          require(api('releases/latest')['id'] == release_id, 'Latest release not confirmed')
          print('Published verified public release:', published['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published [{TAG}]({published["html_url"]}) from `{SOURCE}` with {len(local)} verified assets.\n')
          CODIA_PY
