name: Publish source release
run-name: Codia source release · ${{ github.ref_name }} · run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the release instead of keeping it as a draft
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: codia-source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub source release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail

          notes=$(cat <<EOF
          # Codia v${VERSION}

          Source-only release for commit \`${GITHUB_SHA}\`.

          GitHub generates the **Source code (zip)** and **Source code (tar.gz)** archives directly from the tagged commit. No desktop installer or locally compiled artifact is attached to this release.
          EOF
          )

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq .draft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG is already published; refusing to replace it." >&2
              exit 1
            fi
            gh release edit "$TAG" \
              --repo "$REPOSITORY" \
              --title "Codia $TAG" \
              --notes "$notes"
          else
            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Codia $TAG" \
              --notes "$notes" \
              --draft
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest
          fi
