name: Build release artifacts on a free self-hosted runner
run-name: Codia local packages · ${{ github.ref_name }} · run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the draft after the local build succeeds
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: codia-local-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    # This label intentionally prevents GitHub-hosted paid runners from running releases.
    runs-on: [self-hosted, Windows, X64, codia-release]
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install locked dependencies
        run: node scripts/ci-install-dependencies.mjs
      - name: Compile locally and upload the exact source and Windows packages
        shell: powershell
        run: |
          $arguments = @{
            Version = (node -p "require('./package.json').version")
            Repository = $env:GITHUB_REPOSITORY
            Token = $env:GITHUB_TOKEN
          }
          if ('${{ inputs.publish_release }}' -eq 'true') {
            $arguments.Publish = $true
          }
          & ./scripts/publish-local-release.ps1 @arguments
